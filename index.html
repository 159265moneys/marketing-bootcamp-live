<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f1eb">
  <meta name="description" content="マーケの全体像から、思考・表現・Web・Git・AI、サービスの立ち上げまで。スクロールで進むマーケ合宿。">
  <title>マーケ合宿 — 動かして、覚える。</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#deck">スライドへ</a>
  <header class="chrome topbar">
    <a href="#cover" class="wordmark" aria-label="最初のスライド">マーケ合宿<span>FIELD NOTES</span></a>
    <div class="toolbar">
      <button id="motion-toggle" type="button" aria-pressed="true">動き ON</button>
      <button id="fullscreen" type="button">全画面</button>
      <button id="index-open" type="button" aria-haspopup="dialog">目次<span class="menu-glyph" aria-hidden="true"><i></i><i></i></span></button>
    </div>
  </header>
  <main id="deck" class="deck" tabindex="-1" aria-label="マーケ合宿のスライド"></main>
  <footer class="chrome bottombar">
    <div class="location"><span id="chapter-current">INTRODUCTION</span><span class="page-count"><b id="current">01</b><span>/</span><span id="total">44</span></span></div>
    <div class="paging"><button id="previous" type="button" aria-label="前のスライド">前へ</button><button id="next" type="button" aria-label="次のスライド">次へ</button></div>
  </footer>
  <div class="progress-track" aria-hidden="true"><div id="progress"></div></div>
  <dialog id="index-dialog" aria-labelledby="index-title">
    <div class="index-top"><h2 id="index-title">目次</h2><button id="index-close" type="button">閉じる</button></div>
    <nav id="index-list" aria-label="スライド一覧"></nav>
  </dialog>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="no-script">このスライドにはJavaScriptが必要です。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
